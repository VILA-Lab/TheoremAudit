<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:light dark;--bg:#f4f6f2;--surface:#fff;--surface2:#edf2ed;--ink:#14231c;--muted:#66736c;--line:#d7ddd7;--brand:#176b4d;--brand2:#dcefe5;--gold:#d28a35;--danger:#b84a43;--shadow:0 18px 50px rgba(20,35,28,.09)}
    @media(prefers-color-scheme:dark){:root{--bg:#111714;--surface:#18211d;--surface2:#202c26;--ink:#edf5f0;--muted:#9aaba2;--line:#34423a;--brand:#65c99e;--brand2:#1d3b2e;--gold:#e3a65e;--danger:#ed7b73;--shadow:0 18px 50px rgba(0,0,0,.25)}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:420px;padding:18px}.frame{max-width:1180px;margin:auto;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--surface),var(--surface2))}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:12px;background:#17251f;display:grid;place-items:center}.mark svg{width:28px}.overline{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:800}.brand h1{font:650 22px/1.15 ui-serif,Georgia,serif;margin:2px 0 0}.actions{display:flex;gap:8px;align-items:center}button,.button{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);color:var(--ink);font:600 12px inherit;cursor:pointer}button:hover{border-color:var(--brand);color:var(--brand)}button.primary{background:var(--brand);border-color:var(--brand);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
    .controls{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:10px;padding:14px 22px;border-bottom:1px solid var(--line)}select,input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit}.tabs{display:flex;gap:4px;padding:10px 22px 0;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);padding:10px 13px}.tab.active{border-bottom-color:var(--brand);color:var(--ink)}
    main{padding:20px 22px 24px}.hero{display:grid;grid-template-columns:1.5fr .5fr;gap:14px;margin-bottom:15px}.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px}.question{font:550 22px/1.32 ui-serif,Georgia,serif;margin:4px 0 14px}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:750}.route{display:flex;flex-direction:column;justify-content:center;background:var(--brand2)}.route strong{font:650 21px ui-serif,Georgia,serif;color:var(--brand)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:var(--surface2);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted)}
    h2{font:650 17px ui-serif,Georgia,serif;margin:0 0 11px}.section{margin-top:15px}.pipeline{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.stage{min-width:92px;padding:10px;border:1px solid var(--line);border-top-width:4px;border-radius:8px;background:var(--surface2)}.stage.completed{border-top-color:var(--brand)}.stage.in_progress{border-top-color:var(--gold)}.stage.pending{opacity:.56}.stage b{display:block;font-size:11px}.stage span{font-size:10px;color:var(--muted)}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--surface2)}.metric strong{font-size:21px;display:block}.metric span{font-size:11px;color:var(--muted)}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:14px}.item h3{margin:0 0 5px;font-size:13px}.item p{margin:0;color:var(--muted)}.item.major{border-left:4px solid var(--gold)}.item.fatal{border-left:4px solid var(--danger)}
    .coverage{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.coverage div{border:1px solid var(--line);border-radius:10px;padding:10px}.yes{color:var(--brand);font-weight:800}.no{color:var(--muted)}.ask{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.empty{color:var(--muted);font-style:italic;padding:12px}.hidden{display:none!important}.toast{position:fixed;right:24px;bottom:20px;background:var(--ink);color:var(--surface);padding:10px 13px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
    @media(max-width:720px){.shell{padding:0}.frame{border-radius:0;border-left:0;border-right:0}.hero{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.coverage{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.controls{grid-template-columns:1fr}.ask{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="shell"><div class="frame">
  <header><div class="brand"><div class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M9 52V12h46v40M20 52V24h24v28" fill="none" stroke="#dceee5" stroke-width="6" stroke-linecap="round"/><path d="M27 37h10" stroke="#e6a85c" stroke-width="6" stroke-linecap="round"/></svg></div><div><div class="overline">Governed research</div><h1>TheoremAudit</h1></div></div><div class="actions"><button id="refresh">↻ Refresh</button><button id="fullscreen">⛶ Fullscreen</button><button id="continue" class="primary">Continue stage</button></div></header>
  <div class="controls"><select id="run" aria-label="Select run"></select><div class="chips" id="statusChips"></div></div>
  <nav class="tabs" aria-label="Evidence views"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="results">Results</button><button class="tab" data-tab="blockers">Blockers</button><button class="tab" data-tab="evidence">Evidence</button></nav>
  <main>
    <section id="overview" class="panel"><div class="hero"><div class="card"><div class="eyebrow">Research question</div><div class="question" id="question"></div><div class="chips" id="metadata"></div></div><div class="card route"><div class="eyebrow">Manuscript</div><strong id="tier"></strong><span id="paperType"></span></div></div><div class="metrics" id="metrics"></div><div class="section card"><h2>Theory pipeline</h2><div class="pipeline" id="theory"></div></div><div class="section card"><h2>Paper pipeline</h2><div class="pipeline" id="paper"></div></div></section>
    <section id="results" class="panel hidden"><div class="card"><h2>Accepted results</h2><div class="list" id="resultsList"></div></div><div class="section card"><h2>Research results still in development</h2><div class="list" id="retainedList"></div></div><div class="section card"><h2>Invalid results excluded</h2><div class="list" id="excludedList"></div></div></section>
    <section id="blockers" class="panel hidden"><div class="card"><h2>Open blockers</h2><div class="list" id="blockerList"></div></div></section>
    <section id="evidence" class="panel hidden"><div class="card"><h2>Empirical evidence</h2><div class="coverage" id="coverage"></div><div class="section"><h2>Routing rationale</h2><div class="list" id="reasons"></div></div></div></section>
    <div class="ask"><input id="askInput" placeholder="Ask about this run, theorem, blocker, or next stage…"><button id="askButton" class="primary">Ask TheoremAudit</button></div>
  </main>
</div></div><div class="toast" id="toast"></div>
<script>
(()=>{let data=null,current=null,nextId=1;const pending=new Map(),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=v=>esc(String(v??'').replaceAll('_',' '));function toast(message){$('toast').textContent=message;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function bridge(method,params){const id=nextId++;window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}))}
async function callTool(name,args){if(window.openai?.callTool)return window.openai.callTool(name,args);return bridge('tools/call',{name,arguments:args})}
async function message(prompt){if(window.openai?.sendFollowUpMessage)return window.openai.sendFollowUpMessage({prompt,scrollToBottom:true});return bridge('ui/message',{role:'user',content:[{type:'text',text:prompt}]})}
function stages(items){return items?.length?items.map(s=>`<div class="stage ${esc(s.status)}"><b>${label(s.label)}</b><span>${label(s.status)}</span></div>`).join(''):'<div class="empty">Not started.</div>'}
function render(){if(!current)return;$('question').textContent=current.question;$('tier').textContent=label(current.route.manuscript_kind);$('paperType').textContent=label(current.route.submission_readiness);$('metadata').innerHTML=[`Novelty: ${current.route.novelty}`,`Significance: ${current.route.significance}`].map(x=>`<span class="chip">${label(x)}</span>`).join('');$('statusChips').innerHTML=[current.theory_status,current.paper_status].map(x=>`<span class="chip">${label(x)}</span>`).join('');$('theory').innerHTML=stages(current.theory_stages);$('paper').innerHTML=stages(current.paper_stages);
const done=current.theory_stages.filter(s=>s.status==='completed').length,retained=current.retained_nonfinal_statements||[],excluded=current.excluded_statements||[];$('metrics').innerHTML=[[done,'Theory stages'],[current.accepted_statements.length,'Accepted results'],[retained.length,'In development'],[current.blockers.length,'Open blockers']].map(([v,k])=>`<div class="metric"><strong>${esc(v)}</strong><span>${esc(k)}</span></div>`).join('');
$('resultsList').innerHTML=current.accepted_statements.length?current.accepted_statements.map(s=>`<article class="item"><h3>${esc(s.id)} · ${label(s.decision)}</h3><p>${esc(s.informal)}</p></article>`).join(''):'<div class="empty">No accepted result yet.</div>';$('retainedList').innerHTML=retained.length?retained.map(s=>`<article class="item"><h3>${esc(s.id)} · ${label(s.disposition)}</h3><p>${esc(s.informal)}</p><p><b>Not established:</b> ${esc(s.reason)}</p></article>`).join(''):'<div class="empty">No conjecture, repair candidate, or deferred result.</div>';$('excludedList').innerHTML=excluded.length?excluded.map(s=>`<article class="item fatal"><h3>${esc(s.id)} · ${label(s.disposition)}</h3><p>${esc(s.informal)}</p><p><b>Reason:</b> ${esc(s.reason)}</p></article>`).join(''):'<div class="empty">No mathematically invalid result was excluded.</div>';$('blockerList').innerHTML=current.blockers.length?current.blockers.map(b=>`<article class="item ${esc(b.severity)}"><h3>${esc(b.id)} · ${label(b.severity)}</h3><p>${esc(b.description)}</p><p><b>Next:</b> ${esc(b.action)}</p></article>`).join(''):'<div class="empty">No open major or fatal blocker.</div>';
const cov=current.empirical.coverage||{};$('coverage').innerHTML=Object.keys(cov).length?Object.entries(cov).map(([k,v])=>`<div><span class="${v?'yes':'no'}">${v?'✓':'○'}</span> ${label(k)}</div>`).join(''):'<div class="empty">No claim-linked empirical evidence recorded.</div>';$('reasons').innerHTML=current.route.reasons?.length?current.route.reasons.map(x=>`<div class="item">${esc(x)}</div>`).join(''):'<div class="empty">No routing rationale yet.</div>'}
function load(next){if(!next?.runs?.length)return;data=next;const select=$('run');select.innerHTML='';next.runs.forEach(r=>{const o=document.createElement('option');o.value=r.run_id;o.textContent=`${r.run_id} — ${r.question}`;select.appendChild(o)});select.value=next.selected_run_id||next.runs[0].run_id;current=next.runs.find(r=>r.run_id===select.value)||next.runs[0];render()}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result')load(m.params?.structuredContent)});
if(window.openai?.toolOutput)load(window.openai.toolOutput);$('run').onchange=e=>{current=data.runs.find(r=>r.run_id===e.target.value);render();window.openai?.setWidgetState?.({selectedRunId:current.run_id})};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('hidden',p.id!==t.dataset.tab))});
$('refresh').onclick=async()=>{if(!current)return;try{const r=await callTool('theoremgate_dashboard_data',{workspacePath:data.workspace,runId:current.run_id});load(r?.structuredContent);toast('Evidence view refreshed')}catch(e){toast('Refresh unavailable')}};$('fullscreen').onclick=()=>window.openai?.requestDisplayMode?.({mode:'fullscreen'});$('continue').onclick=()=>current&&message(`Continue TheoremAudit run ${current.run_id} from its current governed stage. Validate the existing evidence first and do not bypass actor or artifact rules.`);
async function ask(){const q=$('askInput').value.trim();if(!q||!current)return;await message(`For TheoremAudit run ${current.run_id}: ${q}`);$('askInput').value=''}$('askButton').onclick=ask;$('askInput').onkeydown=e=>{if(e.key==='Enter')ask()};
})();
</script></body></html>
